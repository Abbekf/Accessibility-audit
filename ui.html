<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Tillgänglighetsrevisor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f7fc;
      color: #1a1a2e;
    }

    /* ── Top header ── */
    .header {
      background: #0d1b4b;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: relative;
      z-index: 20;
    }
    .header-brand {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .header-brand em {
      font-style: normal;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      margin-right: 2px;
    }
    .header-brand span { color: #7eaaff; }

    .scan-form {
      display: flex;
      flex: 1;
      min-width: 260px;
      gap: 8px;
    }
    .scan-form input[type="text"] {
      flex: 1;
      padding: 8px 14px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .scan-form input[type="text"]::placeholder { color: rgba(255,255,255,0.45); }
    .scan-form input[type="text"]:focus {
      border-color: #7eaaff;
      background: rgba(255,255,255,0.15);
    }
    .scan-form button {
      padding: 8px 20px;
      background: #1a4db5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .scan-form button:hover:not(:disabled) { background: #1a3d9a; }
    .scan-form button:disabled { background: #3a5070; cursor: not-allowed; }
    #scan-site-btn {
      padding: 8px 20px;
      background: transparent;
      color: #7eaaff;
      border: 1px solid #7eaaff;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    #scan-site-btn:hover:not(:disabled) { background: rgba(126,170,255,0.15); }
    #scan-site-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .model-picker {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .model-picker select {
      padding: 7px 10px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .model-picker select:focus { border-color: #7eaaff; }
    .model-picker select option { background: #0d1b4b; color: #fff; }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .header-actions a,
    .header-actions button {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .header-actions a:hover,
    .header-actions button:hover { background: rgba(255,255,255,0.16); }

    .open-btn {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
      transition: background 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .open-btn:hover { background: rgba(255,255,255,0.16); }

    .status-bar {
      width: 100%;
      padding: 6px 0 0;
      font-size: 12px;
      color: #7eaaff;
      display: none;
    }
    .status-bar.error { color: #ff8a80; }

    /* ── Report frame ── */
    #report-frame {
      display: none;
      width: 100%;
      border: none;
      flex: 1;
    }

    .page-body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Empty / loading state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      gap: 10px;
    }
    .empty-state .icon { font-size: 40px; }
    .empty-state h2 { font-size: 18px; color: #0d1b4b; }
    .empty-state p { font-size: 13px; }

    .loading-state {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      color: #64748b;
      padding: 32px 24px 24px;
      overflow: hidden;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #d0ddf5;
      border-top-color: #1a4db5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state h2 { font-size: 18px; color: #0d1b4b; text-align: center; }
    .loading-state p  { font-size: 13px; text-align: center; }

    /* ── Live log panel ── */
    .log-panel {
      width: 100%;
      max-width: 980px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #0d1424;
      border: 1px solid #1f2c4d;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(13,27,75,0.18);
      margin-top: 4px;
    }
    .log-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #111a36;
      border-bottom: 1px solid #1f2c4d;
      font-size: 11px;
      color: #8aaae0;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .log-header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,0.7);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }
    .log-header .spacer { flex: 1; }
    .log-header button {
      background: rgba(255,255,255,0.06);
      color: #c8d8f0;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 10.5px;
      cursor: pointer;
      letter-spacing: 0.5px;
      font-family: inherit;
      transition: background 0.15s;
    }
    .log-header button:hover { background: rgba(255,255,255,0.14); }
    .log-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px 12px;
      font-family: "SFMono-Regular", "Menlo", "Consolas", monospace;
      font-size: 11.5px;
      line-height: 1.55;
      color: #c8d8f0;
      scrollbar-width: thin;
      scrollbar-color: #2a3a70 transparent;
    }
    .log-body::-webkit-scrollbar { width: 6px; }
    .log-body::-webkit-scrollbar-thumb { background: #2a3a70; border-radius: 3px; }
    .log-row {
      display: flex;
      gap: 8px;
      padding: 1px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-ts    { color: #5a6a8a; flex-shrink: 0; }
    .log-level { font-weight: 700; flex-shrink: 0; min-width: 56px; }
    .log-name  { color: #7eaaff; flex-shrink: 0; min-width: 80px; }
    .log-msg   { color: #d8e3f5; flex: 1; }
    .lv-DEBUG    { color: #6b7c9c; }
    .lv-INFO     { color: #22c55e; }
    .lv-WARNING  { color: #fbbf24; }
    .lv-ERROR    { color: #ef4444; }
    .lv-CRITICAL { color: #f472b6; }
    .log-row.level-WARNING  { background: rgba(251,191,36,0.06); }
    .log-row.level-ERROR    { background: rgba(239,68,68,0.10); }
    .log-row.level-CRITICAL { background: rgba(244,114,182,0.10); }
    .log-empty {
      color: #5a6a8a;
      font-style: italic;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div class="page-body">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">Tillgänglighets<span>revisor</span></div>

      <form class="scan-form" id="scan-form">
        <input type="text" id="url" placeholder="www.exempel.se" required autocomplete="off">
        <button type="submit" id="scan-btn" data-mode="page">Granska en sida</button>
        <button type="button" id="scan-site-btn">Granska alla sidor</button>
      </form>

      <div class="model-picker">
        <select id="provider-select" title="Välj AI-leverantör">
          <option value="openai">OpenAI</option>
          <option value="claude" selected>Claude</option>
          <option value="gemini">Gemini</option>
        </select>
        <select id="model-select" title="Välj modell"></select>
      </div>

      <div class="header-actions" id="header-actions" style="display:none;">
        <button id="save-btn">📄 Skapa rapport</button>
        <button id="pres-btn">📊 Skapa presentation</button>
      </div>

      <div class="status-bar" id="status"></div>
    </header>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state">
      <div class="icon">🔍</div>
      <h2>Ange en URL för att starta</h2>
      <p>Rapporten visas här direkt när skanningen är klar.</p>
    </div>

    <!-- Loading state -->
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <h2 id="loading-url"></h2>
      <p id="loading-msg">Granskar sidan… det tar vanligtvis 20–60 sekunder.</p>

      <div class="log-panel" id="log-panel" aria-live="polite">
        <div class="log-header">
          <span class="dot" id="log-dot"></span>
          <span>Live-logg</span>
          <span id="log-status">ansluter…</span>
          <span class="spacer"></span>
          <button type="button" id="log-pause-btn" title="Pausa autoscroll">⏸ Paus</button>
          <button type="button" id="log-clear-btn" title="Töm loggen i UI:t">🧹 Töm</button>
        </div>
        <div class="log-body" id="log-body">
          <div class="log-empty">Loggrader visas här i realtid när skanningen körs…</div>
        </div>
      </div>
    </div>

    <!-- Report -->
    <iframe id="report-frame" title="Tillgänglighetsrapport"></iframe>
  </div>

  <script>
    const MODELS = {
      openai:  [
        { value: 'gpt-4o',       label: 'GPT-4o' },
        { value: 'gpt-4o-mini',  label: 'GPT-4o mini' },
        { value: 'gpt-4.1',      label: 'GPT-4.1' },
        { value: 'gpt-4.1-mini', label: 'GPT-4.1 mini' },
      ],
      claude: [
        { value: 'claude-sonnet-4-6',         label: 'Claude Sonnet 4.6' },
        { value: 'claude-opus-4-7',            label: 'Claude Opus 4.7' },
        { value: 'claude-haiku-4-5-20251001',  label: 'Claude Haiku 4.5' },
      ],
      gemini: [
        { value: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash' },
        { value: 'gemini-2.5-pro',   label: 'Gemini 2.5 Pro' },
        { value: 'gemini-2.0-flash', label: 'Gemini 2.0 Flash' },
      ],
    };

    const providerSelect = document.getElementById('provider-select');
    const modelSelect    = document.getElementById('model-select');

    const DEFAULT_MODEL = { claude: 'claude-haiku-4-5-20251001' };

    function populateModels(provider) {
      modelSelect.innerHTML = '';
      for (const m of MODELS[provider]) {
        const opt = document.createElement('option');
        opt.value = m.value;
        opt.textContent = m.label;
        if (DEFAULT_MODEL[provider] && m.value === DEFAULT_MODEL[provider]) opt.selected = true;
        modelSelect.appendChild(opt);
      }
    }
    populateModels(providerSelect.value);
    providerSelect.addEventListener('change', () => populateModels(providerSelect.value));

    const form        = document.getElementById('scan-form');
    const statusEl    = document.getElementById('status');
    const frame       = document.getElementById('report-frame');
    const emptyState  = document.getElementById('empty-state');
    const actions     = document.getElementById('header-actions');
    const saveBtn     = document.getElementById('save-btn');
    const presBtn     = document.getElementById('pres-btn');
    const scanBtn     = document.getElementById('scan-btn');
    const scanSiteBtn = document.getElementById('scan-site-btn');
    const urlInput    = document.getElementById('url');

    let lastBlob    = null;
    let lastBlobUrl = null;
    let lastUrl     = null;

    const loadingState = document.getElementById('loading-state');
    const loadingUrl   = document.getElementById('loading-url');

    function showLoading(url, isSite) {
      emptyState.style.display   = 'none';
      loadingState.style.display = 'flex';
      frame.style.display        = 'none';
      loadingUrl.textContent     = url;
      document.getElementById('loading-msg').textContent = isSite
        ? 'Crawlar och granskar alla sidor… detta kan ta flera minuter beroende på sajtens storlek.'
        : 'Granskar sidan… det tar vanligtvis 20–60 sekunder.';
    }
    function showReport() {
      loadingState.style.display = 'none';
      emptyState.style.display   = 'none';
      frame.style.display        = 'block';
    }
    function showEmpty() {
      loadingState.style.display = 'none';
      frame.style.display        = 'none';
      emptyState.style.display   = 'flex';
    }

    function showError(msg) {
      statusEl.className = 'status-bar error';
      statusEl.style.display = 'block';
      statusEl.textContent = 'Fel: ' + msg;
    }

    function normaliseUrl(raw) {
      const trimmed = (raw || '').trim();
      if (!trimmed) return '';
      return /^https?:\/\//i.test(trimmed) ? trimmed : 'https://' + trimmed;
    }

    // ── Live-logg via SSE ────────────────────────────────────────────────────
    const logBody    = document.getElementById('log-body');
    const logStatus  = document.getElementById('log-status');
    const logDot     = document.getElementById('log-dot');
    const pauseBtn   = document.getElementById('log-pause-btn');
    const clearBtn   = document.getElementById('log-clear-btn');
    let   logSource  = null;
    let   logPaused  = false;
    let   logHadAny  = false;

    function clearLog() {
      logBody.innerHTML = '<div class="log-empty">Loggrader visas här i realtid när skanningen körs…</div>';
      logHadAny = false;
    }

    function appendLog(entry) {
      if (!logHadAny) {
        logBody.innerHTML = '';
        logHadAny = true;
      }
      const row = document.createElement('div');
      row.className = 'log-row level-' + entry.level;
      const ts = (entry.ts || '').split('T')[1]?.slice(0, 12) || '';
      row.innerHTML =
        '<span class="log-ts"></span>' +
        '<span class="log-level lv-' + entry.level + '"></span>' +
        '<span class="log-name"></span>' +
        '<span class="log-msg"></span>';
      row.children[0].textContent = ts;
      row.children[1].textContent = entry.level;
      row.children[2].textContent = entry.logger || '';
      row.children[3].textContent = entry.message || '';
      logBody.appendChild(row);

      // Begränsa antal rader för att undvika minnesläckor
      while (logBody.children.length > 600) logBody.removeChild(logBody.firstChild);

      if (!logPaused) {
        logBody.scrollTop = logBody.scrollHeight;
      }
    }

    function connectLogStream() {
      if (logSource) return;
      try {
        logSource = new EventSource('/logs/stream');
        logStatus.textContent = 'ansluter…';
        logDot.style.background = '#fbbf24';

        logSource.onopen = () => {
          logStatus.textContent = 'live';
          logDot.style.background = '#22c55e';
        };
        logSource.onmessage = (ev) => {
          if (!ev.data || ev.data.startsWith(':')) return;
          try { appendLog(JSON.parse(ev.data)); } catch (e) { /* ignore */ }
        };
        logSource.onerror = () => {
          logStatus.textContent = 'frånkopplad — försöker igen…';
          logDot.style.background = '#ef4444';
        };
      } catch (e) {
        logStatus.textContent = 'kunde inte starta';
        logDot.style.background = '#ef4444';
      }
    }

    pauseBtn.onclick = () => {
      logPaused = !logPaused;
      pauseBtn.textContent = logPaused ? '▶ Forts.' : '⏸ Paus';
      pauseBtn.title = logPaused ? 'Återuppta autoscroll' : 'Pausa autoscroll';
      if (!logPaused) logBody.scrollTop = logBody.scrollHeight;
    };
    clearBtn.onclick = clearLog;

    // Anslut till loggen direkt när sidan laddas så vi ser allt som händer.
    connectLogStream();

    async function runScan(endpoint, label) {
      const url = normaliseUrl(urlInput.value);
      if (!url || url === 'https://') {
        showError('Ange en URL först (t.ex. www.exempel.se)');
        urlInput.focus();
        return;
      }

      scanBtn.disabled = true;
      scanSiteBtn.disabled = true;
      statusEl.style.display = 'block';
      statusEl.className = 'status-bar';
      statusEl.textContent = '';
      actions.style.display = 'none';
      clearLog();
      showLoading(label || url, endpoint === '/scan-site');

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, provider: providerSelect.value, model: modelSelect.value })
        });
        if (!res.ok) throw new Error(await res.text());

        lastBlob = await res.blob();
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = URL.createObjectURL(lastBlob);
        lastUrl = url;

        frame.src = lastBlobUrl;
        showReport();
        actions.style.display = 'flex';
        statusEl.textContent = 'Färdig!';
      } catch (err) {
        showError(err.message || String(err));
        showEmpty();
      } finally {
        scanBtn.disabled = false;
        scanSiteBtn.disabled = false;
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      runScan('/scan');
    });

    scanSiteBtn.addEventListener('click', () => {
      const url = normaliseUrl(urlInput.value);
      if (!url || url === 'https://') {
        showError('Ange en URL först (t.ex. www.exempel.se)');
        urlInput.focus();
        return;
      }
      runScan('/scan-site', `Skannar alla sidor på ${url}…`);
    });

    saveBtn.addEventListener('click', () => {
      // postMessage till iframen som lyssnar och kör window.print()
      if (frame.style.display === 'none' || !frame.contentWindow) {
        showError('Ingen rapport att skriva ut ännu — kör en granskning först.');
        return;
      }
      try {
        frame.contentWindow.postMessage('printReport', '*');
      } catch (err) {
        // Fallback: öppna i nytt fönster och låt användaren trycka Ctrl/Cmd+P
        if (lastBlobUrl) window.open(lastBlobUrl, '_blank');
        else showError('Kunde inte skicka utskriftsbegäran: ' + err.message);
      }
    });

    presBtn.addEventListener('click', async () => {
      if (!lastUrl) {
        showError('Kör en granskning först innan du skapar en presentation.');
        return;
      }
      // Öppna fliken SYNKRONT (innan await) för att undvika popup-blockerare.
      const popup = window.open('about:blank', '_blank');
      if (popup) {
        try {
          popup.document.write(
            '<title>Genererar presentation…</title>' +
            '<body style="background:#0d1b4b;color:#fff;font-family:sans-serif;display:flex;' +
            'align-items:center;justify-content:center;height:100vh;margin:0">' +
            '<div style="text-align:center"><div style="font-size:32px">⏳</div>' +
            '<div style="margin-top:12px">Genererar presentation…</div></div></body>'
          );
          popup.document.close();
        } catch (e) { /* about:blank kan vara skrivskyddad i vissa browsers */ }
      }

      presBtn.disabled = true;
      presBtn.textContent = '⏳ Genererar…';
      try {
        const res = await fetch('/presentation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: lastUrl, provider: providerSelect.value, model: modelSelect.value })
        });
        if (!res.ok) throw new Error(await res.text());
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        if (popup && !popup.closed) {
          popup.location.href = blobUrl;
        } else {
          // Popup-blockerare: erbjud nedladdningslänk istället
          const a = document.createElement('a');
          a.href = blobUrl;
          a.target = '_blank';
          a.rel = 'noopener';
          a.download = 'presentation.html';
          a.click();
        }
      } catch (err) {
        if (popup) try { popup.close(); } catch (_) {}
        showError(err.message || String(err));
      } finally {
        presBtn.disabled = false;
        presBtn.textContent = '📊 Skapa presentation';
      }
    });

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'a11y-diag') {
        console.log('[a11y-diag from iframe]', JSON.stringify(e.data));
      }
    });

  </script>
</body>
</html>
