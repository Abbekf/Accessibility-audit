<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Tillgänglighetsrevisor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f7fc;
      color: #1a1a2e;
    }

    /* ── Top header ── */
    .header {
      background: #0d1b4b;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: relative;
      z-index: 20;
    }
    .header-brand {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .header-brand em {
      font-style: normal;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      margin-right: 2px;
    }
    .header-brand span { color: #7eaaff; }

    .scan-form {
      display: flex;
      flex: 1;
      min-width: 260px;
      gap: 8px;
    }
    .scan-form input[type="text"] {
      flex: 1;
      padding: 8px 14px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .scan-form input[type="text"]::placeholder { color: rgba(255,255,255,0.45); }
    .scan-form input[type="text"]:focus {
      border-color: #7eaaff;
      background: rgba(255,255,255,0.15);
    }
    .scan-form button {
      padding: 8px 20px;
      background: #1a4db5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .scan-form button:hover:not(:disabled) { background: #1a3d9a; }
    .scan-form button:disabled { background: #3a5070; cursor: not-allowed; }
    #scan-site-btn {
      padding: 8px 20px;
      background: transparent;
      color: #7eaaff;
      border: 1px solid #7eaaff;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    #scan-site-btn:hover:not(:disabled) { background: rgba(126,170,255,0.15); }
    #scan-site-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .model-picker {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .model-picker select {
      padding: 7px 10px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .model-picker select:focus { border-color: #7eaaff; }
    .model-picker select option { background: #0d1b4b; color: #fff; }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .header-actions a,
    .header-actions button {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .header-actions a:hover,
    .header-actions button:hover { background: rgba(255,255,255,0.16); }

    .open-btn {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
      transition: background 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .open-btn:hover { background: rgba(255,255,255,0.16); }

    .status-bar {
      width: 100%;
      padding: 6px 0 0;
      font-size: 12px;
      color: #7eaaff;
      display: none;
    }
    .status-bar.error { color: #ff8a80; }

    /* ── Report frame ── */
    #report-frame {
      display: none;
      width: 100%;
      border: none;
      flex: 1;
    }

    .page-body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Empty / loading state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      gap: 10px;
    }
    .empty-state .icon { font-size: 40px; }
    .empty-state h2 { font-size: 18px; color: #0d1b4b; }
    .empty-state p { font-size: 13px; }

    .loading-state {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #64748b;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #d0ddf5;
      border-top-color: #1a4db5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state h2 { font-size: 18px; color: #0d1b4b; }
    .loading-state p  { font-size: 13px; }
  </style>
</head>
<body>
  <div class="page-body">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">Tillgänglighets<span>revisor</span></div>

      <form class="scan-form" id="scan-form">
        <input type="text" id="url" placeholder="www.exempel.se" required autocomplete="off">
        <button type="submit" id="scan-btn" data-mode="page">Granska en sida</button>
        <button type="button" id="scan-site-btn">Granska alla sidor</button>
      </form>

      <div class="model-picker">
        <select id="provider-select" title="Välj AI-leverantör">
          <option value="openai">OpenAI</option>
          <option value="claude" selected>Claude</option>
          <option value="gemini">Gemini</option>
        </select>
        <select id="model-select" title="Välj modell"></select>
      </div>

      <div class="header-actions" id="header-actions" style="display:none;">
        <button id="save-btn">📄 Skapa rapport</button>
        <button id="pres-btn">📊 Skapa presentation</button>
      </div>

      <div class="status-bar" id="status"></div>
    </header>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state">
      <div class="icon">🔍</div>
      <h2>Ange en URL för att starta</h2>
      <p>Rapporten visas här direkt när skanningen är klar.</p>
    </div>

    <!-- Loading state -->
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <h2 id="loading-url"></h2>
      <p id="loading-msg">Granskar sidan… det tar vanligtvis 20–60 sekunder.</p>
    </div>

    <!-- Report -->
    <iframe id="report-frame" title="Tillgänglighetsrapport"></iframe>
  </div>

  <script>
    const MODELS = {
      openai:  [
        { value: 'gpt-4o',       label: 'GPT-4o' },
        { value: 'gpt-4o-mini',  label: 'GPT-4o mini' },
        { value: 'gpt-4.1',      label: 'GPT-4.1' },
        { value: 'gpt-4.1-mini', label: 'GPT-4.1 mini' },
      ],
      claude: [
        { value: 'claude-sonnet-4-6',         label: 'Claude Sonnet 4.6' },
        { value: 'claude-opus-4-7',            label: 'Claude Opus 4.7' },
        { value: 'claude-haiku-4-5-20251001',  label: 'Claude Haiku 4.5' },
      ],
      gemini: [
        { value: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash' },
        { value: 'gemini-2.5-pro',   label: 'Gemini 2.5 Pro' },
        { value: 'gemini-2.0-flash', label: 'Gemini 2.0 Flash' },
      ],
    };

    const providerSelect = document.getElementById('provider-select');
    const modelSelect    = document.getElementById('model-select');

    const DEFAULT_MODEL = { claude: 'claude-haiku-4-5-20251001' };

    function populateModels(provider) {
      modelSelect.innerHTML = '';
      for (const m of MODELS[provider]) {
        const opt = document.createElement('option');
        opt.value = m.value;
        opt.textContent = m.label;
        if (DEFAULT_MODEL[provider] && m.value === DEFAULT_MODEL[provider]) opt.selected = true;
        modelSelect.appendChild(opt);
      }
    }
    populateModels(providerSelect.value);
    providerSelect.addEventListener('change', () => populateModels(providerSelect.value));

    const form        = document.getElementById('scan-form');
    const statusEl    = document.getElementById('status');
    const frame       = document.getElementById('report-frame');
    const emptyState  = document.getElementById('empty-state');
    const actions     = document.getElementById('header-actions');
    const saveBtn     = document.getElementById('save-btn');

    let lastBlob    = null;
    let lastBlobUrl = null;
    let lastUrl     = null;

    const loadingState = document.getElementById('loading-state');
    const loadingUrl   = document.getElementById('loading-url');

    function showLoading(url, isSite) {
      emptyState.style.display   = 'none';
      loadingState.style.display = 'flex';
      frame.style.display        = 'none';
      loadingUrl.textContent     = url;
      document.getElementById('loading-msg').textContent = isSite
        ? 'Crawlar och granskar alla sidor… detta kan ta flera minuter beroende på sajtens storlek.'
        : 'Granskar sidan… det tar vanligtvis 20–60 sekunder.';
    }
    function showReport() {
      loadingState.style.display = 'none';
      emptyState.style.display   = 'none';
      frame.style.display        = 'block';
    }
    function showEmpty() {
      loadingState.style.display = 'none';
      frame.style.display        = 'none';
      emptyState.style.display   = 'flex';
    }

    async function runScan(endpoint, label) {
      let url = document.getElementById('url').value.trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      document.getElementById('scan-btn').disabled = true;
      document.getElementById('scan-site-btn').disabled = true;
      statusEl.style.display = 'block';
      statusEl.className = 'status-bar';
      statusEl.textContent = '';
      actions.style.display = 'none';
      showLoading(label || url, endpoint === '/scan-site');

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, provider: providerSelect.value, model: modelSelect.value })
        });
        if (!res.ok) throw new Error(await res.text());

        lastBlob = await res.blob();
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = URL.createObjectURL(lastBlob);
        lastUrl = url;

        frame.src = lastBlobUrl;
        showReport();
        actions.style.display = 'flex';
        statusEl.textContent = 'Färdig!';
      } catch (err) {
        statusEl.className = 'status-bar error';
        statusEl.textContent = 'Fel: ' + err.message;
        showEmpty();
      } finally {
        document.getElementById('scan-btn').disabled = false;
        document.getElementById('scan-site-btn').disabled = false;
      }
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      runScan('/scan');
    };

    document.getElementById('scan-site-btn').onclick = () => {
      const url = document.getElementById('url').value.trim();
      runScan('/scan-site', `Skannar alla sidor på ${url}…`);
    };

    saveBtn.onclick = () => {
      const iframe = document.getElementById('report-frame');
      if (!iframe || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage('printReport', '*');
    };

    const presBtn = document.getElementById('pres-btn');
    presBtn.onclick = async () => {
      if (!lastUrl) return;
      presBtn.disabled = true;
      presBtn.textContent = '⏳ Genererar…';
      try {
        const res = await fetch('/presentation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: lastUrl, provider: providerSelect.value, model: modelSelect.value })
        });
        if (!res.ok) throw new Error(await res.text());
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        window.open(blobUrl, '_blank');
      } catch (err) {
        statusEl.className = 'status-bar error';
        statusEl.style.display = 'block';
        statusEl.textContent = 'Fel: ' + err.message;
      } finally {
        presBtn.disabled = false;
        presBtn.textContent = '📊 Skapa presentation';
      }
    };

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'a11y-diag') {
        console.log('[a11y-diag from iframe]', JSON.stringify(e.data));
      }
    });

  </script>
</body>
</html>
