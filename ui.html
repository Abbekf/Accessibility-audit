<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Tillgänglighetsrevisor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f7fc;
      color: #1a1a2e;
    }

    /* ── Top header ── */
    .header {
      background: #0d1b4b;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: relative;
      z-index: 20;
    }
    .header-brand {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .header-brand span { color: #7eaaff; }

    .scan-form {
      display: flex;
      flex: 1;
      min-width: 260px;
      gap: 8px;
    }
    .scan-form input[type="url"] {
      flex: 1;
      padding: 8px 14px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .scan-form input[type="url"]::placeholder { color: rgba(255,255,255,0.45); }
    .scan-form input[type="url"]:focus {
      border-color: #7eaaff;
      background: rgba(255,255,255,0.15);
    }
    .scan-form button {
      padding: 8px 20px;
      background: #1a4db5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .scan-form button:hover:not(:disabled) { background: #1a3d9a; }
    .scan-form button:disabled { background: #3a5070; cursor: not-allowed; }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .header-actions a,
    .header-actions button {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .header-actions a:hover,
    .header-actions button:hover { background: rgba(255,255,255,0.16); }

    .status-bar {
      width: 100%;
      padding: 6px 0 0;
      font-size: 12px;
      color: #7eaaff;
      display: none;
    }
    .status-bar.error { color: #ff8a80; }

    /* ── Report frame ── */
    #report-frame {
      display: none;
      width: 100%;
      border: none;
      flex: 1;
    }

    .page-body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Empty / loading state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      gap: 10px;
    }
    .empty-state .icon { font-size: 40px; }
    .empty-state h2 { font-size: 18px; color: #0d1b4b; }
    .empty-state p { font-size: 13px; }

    .loading-state {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #64748b;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #d0ddf5;
      border-top-color: #1a4db5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state h2 { font-size: 18px; color: #0d1b4b; }
    .loading-state p  { font-size: 13px; }
  </style>
</head>
<body>
  <div class="page-body">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">Tillgänglighets<span>revisor</span></div>

      <form class="scan-form" id="scan-form">
        <input type="url" id="url" placeholder="https://www.exempel.se" required autocomplete="off">
        <button type="submit" id="scan-btn">Starta granskning</button>
      </form>

      <div class="header-actions" id="header-actions" style="display:none;">
        <a id="fullscreen-link" href="#" target="_blank">Helskärm ↗</a>
        <button id="save-btn">Spara</button>
        <a id="download-link" href="#" download="rapport.html">Ladda ner</a>
      </div>

      <div class="status-bar" id="status"></div>
    </header>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state">
      <div class="icon">🔍</div>
      <h2>Ange en URL för att starta</h2>
      <p>Rapporten visas här direkt när skanningen är klar.</p>
    </div>

    <!-- Loading state -->
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <h2 id="loading-url"></h2>
      <p>Granskar sidan… det tar vanligtvis 20–60 sekunder.</p>
    </div>

    <!-- Report -->
    <iframe id="report-frame" title="Tillgänglighetsrapport"></iframe>
  </div>

  <script>
    const form        = document.getElementById('scan-form');
    const statusEl    = document.getElementById('status');
    const frame       = document.getElementById('report-frame');
    const emptyState  = document.getElementById('empty-state');
    const actions     = document.getElementById('header-actions');
    const dlLink      = document.getElementById('download-link');
    const fsLink      = document.getElementById('fullscreen-link');
    const saveBtn     = document.getElementById('save-btn');

    let lastBlobUrl = null;
    let lastUrl     = null;

    const loadingState = document.getElementById('loading-state');
    const loadingUrl   = document.getElementById('loading-url');

    function showLoading(url) {
      emptyState.style.display   = 'none';
      loadingState.style.display = 'flex';
      frame.style.display        = 'none';
      loadingUrl.textContent     = url;
    }
    function showReport() {
      loadingState.style.display = 'none';
      emptyState.style.display   = 'none';
      frame.style.display        = 'block';
    }
    function showEmpty() {
      loadingState.style.display = 'none';
      frame.style.display        = 'none';
      emptyState.style.display   = 'flex';
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const url = document.getElementById('url').value;
      document.getElementById('scan-btn').disabled = true;
      statusEl.style.display = 'block';
      statusEl.className = 'status-bar';
      statusEl.textContent = '';
      actions.style.display = 'none';
      showLoading(url);

      try {
        const res = await fetch('/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        if (!res.ok) throw new Error(await res.text());

        const blob = await res.blob();
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = URL.createObjectURL(blob);
        lastUrl = url;

        const slug = url.replace(/https?:\/\//, '').replace(/\W+/g, '-');
        dlLink.href     = lastBlobUrl;
        dlLink.download = `rapport-${slug}.html`;
        fsLink.href     = lastBlobUrl;

        frame.src = lastBlobUrl;
        showReport();
        actions.style.display = 'flex';
        statusEl.textContent = 'Färdig!';
      } catch (err) {
        statusEl.className = 'status-bar error';
        statusEl.textContent = 'Fel: ' + err.message;
        showEmpty();
      } finally {
        document.getElementById('scan-btn').disabled = false;
      }
    };

    saveBtn.onclick = () => {
      if (!lastBlobUrl) return;
      const saved = JSON.parse(localStorage.getItem('savedReports') || '[]');
      const name  = prompt('Namn på rapporten?', lastUrl) || lastUrl;
      saved.push({ url: lastBlobUrl, name, date: new Date().toLocaleString('sv-SE') });
      localStorage.setItem('savedReports', JSON.stringify(saved));
      alert('Sparad!');
    };
  </script>
</body>
</html>
